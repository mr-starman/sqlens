<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238839ef' stroke-width='2.2' stroke-linecap='round'%3E%3Cellipse cx='10' cy='6' rx='7' ry='3'/%3E%3Cpath d='M3 6v10c0 1.7 3.1 3 7 3M17 6v4'/%3E%3Ccircle cx='17' cy='16' r='3.2'/%3E%3Cpath d='m19.5 18.5 2.5 2.5'/%3E%3C/svg%3E">
  <script>
    // Apply the theme before first paint: the saved choice, else the system preference.
    (function () {
      var theme;
      try { theme = localStorage.getItem('sqlens.theme'); } catch (e) { /* storage blocked */ }
      if (theme !== 'latte' && theme !== 'mocha') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/sqlens.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <ellipse cx="10" cy="6" rx="7" ry="3"/><path d="M3 6v10c0 1.7 3.1 3 7 3M17 6v4"/><circle cx="17" cy="16" r="3.2"/><path d="m19.5 18.5 2.5 2.5"/>
      </svg>
      SQLens
    </div>
    <select id="datasource" class="select" aria-label="Datasource" disabled>
      <option>Loading…</option>
    </select>
    <button id="reload" class="button icon" type="button" title="Reload datasources" aria-label="Reload datasources">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>
      </svg>
    </button>
    <span id="ds-info" class="ds-info"></span>
    <label class="field">
      Rows
      <select id="max-rows" class="select" aria-label="Row limit">
        <option value="10" selected>10</option>
        <option value="100">100</option>
        <option value="1000">1000</option>
        <option value="10000">10000</option>
        <option value="all">All</option>
      </select>
    </label>
    <button id="run" class="button primary" type="button" title="Run the selection, or the statement under the cursor">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg>
      <span class="label">Run</span>
      <kbd id="run-key">Ctrl+Enter</kbd>
    </button>
    <button id="theme" class="button icon" type="button" title="Switch theme" aria-label="Switch theme">
      <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <div id="editor"></div>
  <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

  <main class="results">
    <div class="result-bar">
      <span id="status" class="status">Ready</span>
      <!-- Buttons that act on the current result: export, copy (js/export.js). -->
      <div id="result-actions"></div>
    </div>
    <div id="notice"></div>
    <div id="result" class="grid-scroll"></div>
  </main>
</body>
</html>
